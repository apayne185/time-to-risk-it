repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  # Lint/format with the project's locked tool versions so hooks, CI and editors agree.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: no-raw-data
        name: block licensed data files
        entry: "Licensed data must never be committed"
        language: fail
        files: '\.(dat|sav|sas7bdat)$'
