name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Start Redpanda (for the streaming test)
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v26.2.3 redpanda start \
            --mode=dev-container --smp=1 \
            --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src tests
      - name: Test (synthetic data; real-data tests skip without the licensed files)
        run: uv run pytest --cov=ttr --cov-report=term-missing
      - name: End-to-end smoke on synthetic data
        run: |
          uv run ttr synth --out data/raw/synthetic --n-pairs 100
          uv run ttr ingest --raw-dir data/raw/synthetic --out-dir data/interim/synthetic --synthetic
          uv run ttr clean --interim-dir data/interim/synthetic --out-dir data/processed/synthetic
          uv run ttr eda --processed-dir data/processed/synthetic --out-dir data/reports/synthetic
          uv run ttr landmarks --processed-dir data/processed/synthetic
          uv run ttr features --processed-dir data/processed/synthetic
          uv run ttr train --processed-dir data/processed/synthetic --family rule_baseline \
            --family xgb_cox --model-dir data/models/synthetic --report data/reports/synthetic/models.md
          uv run ttr evaluate --processed-dir data/processed/synthetic --model-dir data/models/synthetic \
            --out-dir data/reports/synthetic
          uv run ttr monitor --processed-dir data/processed/synthetic \
            --bundle data/models/synthetic/decision_model.joblib --report data/reports/synthetic/monitoring.md
      - name: Smoke-test the scoring service
        # Run the venv's entry point directly and always stop it: a lingering `uv run` process
        # holds uv's cache lock and breaks setup-uv's post-job cache prune.
        run: |
          TTR_MODEL_BUNDLE=data/models/synthetic/decision_model.joblib .venv/bin/ttr serve --port 8000 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/model
      - name: Streaming end-to-end through Redpanda
        run: |
          timeout 60 bash -c 'until docker exec redpanda rpk cluster health --exit-when-healthy; do sleep 2; done'
          uv run ttr stream replay --source data/interim/synthetic/daily.parquet
          uv run ttr stream score --players data/processed/synthetic/players.parquet \
            --bundle data/models/synthetic/decision_model.joblib --idle-seconds 10
          uv run ttr stream read --topic rg.scores --min-count 100

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build scoring image
        run: docker build -t time-to-risk-it:ci .
      - name: Image imports the service without training extras
        run: docker run --rm time-to-risk-it:ci python -c "import ttr.serve.app; import importlib.util as u; assert u.find_spec('mlflow') is None"
