AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  time-to-risk-it deployment access for GitHub Actions via OIDC (no long-lived AWS keys).
  The GitHub role can push images and run the scoring-service stack through a CloudFormation
  execution role; it cannot create resources directly.

Parameters:
  ProjectName:
    Type: String
    Default: ttr
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"
  GitHubRepository:
    Type: String
    Default: apayne185/time-to-risk-it
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  GitHubEnvironment:
    Type: String
    Default: production
    Description: Only workflow jobs running in this GitHub environment can assume the role.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "false if the account already has the GitHub OIDC provider."

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Used by CloudFormation itself to create and update the scoring-service stack's resources.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-cfn-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-scoring-service
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ServiceResources
                Effect: Allow
                Action:
                  - ecs:*
                  - elasticloadbalancing:*
                  - application-autoscaling:*
                  - cloudwatch:*
                  - logs:*
                  - sns:*
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:CreateTags
                  - ec2:Describe*
                Resource: "*"
              - Sid: ProjectRolesOnly
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*${ProjectName}*"
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - ecs.application-autoscaling.amazonaws.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub
                "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: push-image-and-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !ImportValue
                  Fn::Sub: "${ProjectName}-repository-arn"
              - Sid: DeployServiceStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource: !Sub
                  "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-scoring-service/*"
              - Sid: TemplateValidation
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: HandRoleToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: ReadServiceStatus
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - elasticloadbalancing:DescribeTargetHealth
                Resource: "*"

Outputs:
  GitHubDeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN secret of the GitHub environment
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Set as the AWS_CFN_EXECUTION_ROLE_ARN secret of the GitHub environment
    Value: !GetAtt CloudFormationExecutionRole.Arn
